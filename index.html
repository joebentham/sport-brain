<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sport Brain">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d12" media="(prefers-color-scheme: dark)">
<title>Sport Brain</title>
<style>
  :root {
    --bg: #f2f3f7;
    --glow-a: rgba(10, 132, 255, 0.07); --glow-b: rgba(94, 92, 230, 0.05); --glow-c: transparent;
    --glass: rgba(255, 255, 255, 0.58); --glass-strong: rgba(255, 255, 255, 0.74);
    --edge: rgba(255, 255, 255, 0.85); --hair: rgba(60, 60, 67, 0.14);
    --ink: #111114; --ink2: rgba(60, 60, 67, 0.72); --ink3: rgba(60, 60, 67, 0.5);
    --shadow: 0 10px 40px rgba(31, 38, 60, 0.10), 0 1px 2px rgba(31, 38, 60, 0.06);
    --blue: #007aff; --red: #ff3b30; --green: #1f9d55; --amber: #b25e00; --gold: #f5a300;
    --green-bg: rgba(52, 199, 89, 0.18); --amber-bg: rgba(255, 159, 10, 0.20); --grey-bg: rgba(120, 120, 128, 0.16);
    --blue-bg: rgba(0, 122, 255, 0.12);
    --seg: rgba(120, 120, 128, 0.14); --seg-on: rgba(255, 255, 255, 0.92);
    --bar: rgba(246, 247, 251, 0.78);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d12;
      --glow-a: rgba(10, 132, 255, 0.09); --glow-b: rgba(94, 92, 230, 0.06); --glow-c: transparent;
      --glass: rgba(255, 255, 255, 0.075); --glass-strong: rgba(255, 255, 255, 0.11);
      --edge: rgba(255, 255, 255, 0.14); --hair: rgba(255, 255, 255, 0.10);
      --ink: #f5f5f7; --ink2: rgba(235, 235, 245, 0.68); --ink3: rgba(235, 235, 245, 0.42);
      --shadow: 0 12px 44px rgba(0, 0, 0, 0.45);
      --blue: #0a84ff; --red: #ff453a; --green: #30d158; --amber: #ffb340; --gold: #ffd60a;
      --green-bg: rgba(48, 209, 88, 0.18); --amber-bg: rgba(255, 159, 10, 0.20); --grey-bg: rgba(120, 120, 128, 0.26);
      --blue-bg: rgba(10, 132, 255, 0.20);
      --seg: rgba(120, 120, 128, 0.26); --seg-on: rgba(255, 255, 255, 0.18);
      --bar: rgba(22, 24, 33, 0.74);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); min-height: 100vh; overflow-x: hidden;
    font: 16px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(42% 36% at 12% 8%, var(--glow-a), transparent 70%),
      radial-gradient(40% 34% at 92% 22%, var(--glow-b), transparent 70%),
      radial-gradient(46% 38% at 50% 100%, var(--glow-c), transparent 70%),
      var(--bg); }
  main { max-width: 720px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  a { color: inherit; text-decoration: none; }

  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 24px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 4px 16px; }
  .date { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink3); }
  h1 { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.022em; margin: 2px 0 0; }
  .hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .stamp { font-size: 12px; color: var(--ink3); white-space: nowrap; display: flex; align-items: center; gap: 6px; }

  /* Page navigation: a segmented control in the header on wide screens, a tab bar at the bottom on phones */
  .tabs { display: flex; gap: 2px; padding: 3px; background: var(--seg); border-radius: 12px;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .tabs a { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink2); padding: 6px 12px; border-radius: 9px; }
  .tabs svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .tabs a[aria-current="page"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  .stamp .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

  /* Hero: the one answer to "what should I put on?" */
  .hero { padding: 20px; position: relative; overflow: hidden; display: block; }
  .hero .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 7px; }
  .hero.live .kicker { color: var(--red); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); animation: pulse 1.8s infinite; flex: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(255, 59, 48, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .hero .big { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; margin-top: 8px; }
  .hero .sub { color: var(--ink2); font-size: 15px; margin-top: 4px; }
  .hero .why { font-size: 16px; margin-top: 10px; }
  .hero .score { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 10px; }
  .hero .status { font-size: 14px; color: var(--ink2); margin-top: 2px; }
  .hero .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; font-weight: 600; font-size: 15px;
    padding: 10px 18px; border-radius: 999px; }
  .btn.off { background: var(--grey-bg); color: var(--ink2); }
  .hero .emoji { position: absolute; right: -6px; top: -14px; font-size: 96px; opacity: 0.16; transform: rotate(12deg); pointer-events: none; }

  .section { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink3); }

  .seg { display: flex; gap: 2px; padding: 3px; margin: 22px 0 0; background: var(--seg); border-radius: 12px;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .seg button { flex: 1; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink2); background: transparent; border: 0;
    padding: 7px 8px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }

  .section { margin: 26px 6px 8px; display: flex; justify-content: space-between; gap: 10px; }
  .list { overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--hair); }
  a.row:active { background: var(--glass-strong); }
  .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: var(--grey-bg); }
  .t1 .ic { background: linear-gradient(145deg, rgba(255, 214, 10, 0.42), rgba(255, 159, 10, 0.22)); }
  .title { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .star { color: var(--gold); margin-right: 3px; font-size: 13px; vertical-align: 1px; }
  .star.two { color: var(--ink3); }
  .meta { color: var(--ink2); font-size: 13px; margin-top: 1px; }
  .why { font-size: 14px; margin-top: 5px; }
  .rowscore { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.own { color: var(--green); background: var(--green-bg); }
  .chip.maybe { color: var(--amber); background: var(--amber-bg); }
  .chip.no { color: var(--ink2); background: var(--grey-bg); }
  a.chip.link { color: var(--blue); background: var(--blue-bg); }
  .note { font-size: 12px; color: var(--ink3); }
  .when { text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; }
  .when small { display: block; font-size: 12px; font-weight: 500; color: var(--ink3); }
  .when.live { color: var(--red); }
  button.reveal { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: var(--grey-bg); color: var(--ink2);
    border-radius: 999px; padding: 5px 12px; margin-top: 6px; cursor: pointer; }

  /* Secondary teams: one quiet line each */
  .row.mini { grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 16px; }
  .row.mini + .row::before, .row + .row.mini::before { left: 48px; }
  .row.mini .ic { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; background: transparent; }
  .row.mini .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: var(--ink2); }
  .row.mini .line b { font-weight: 600; color: var(--ink); }
  .row.mini .when { font-size: 13px; font-weight: 500; color: var(--ink2); padding: 0; }
  .row.mini .when.live { color: var(--red); font-weight: 600; }
  .row.mini button.reveal { margin: 0; padding: 3px 10px; font-size: 12px; }

  /* Storylines */
  .story { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 16px; position: relative; }
  .story + .story::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hair); }
  a.story:active { background: var(--glass-strong); }
  .story .txt { font-size: 15px; line-height: 1.36; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink2);
    background: var(--grey-bg); border-radius: 6px; padding: 2px 6px; margin-right: 7px; vertical-align: 1px; }
  .tag.event { color: var(--blue); background: var(--blue-bg); }
  .story .go { color: var(--ink3); font-size: 17px; }
  .story button.reveal { margin: 0; }

  .empty { color: var(--ink2); font-size: 15px; padding: 18px 20px; }
  .empty.small { font-size: 14px; padding: 13px 16px; }
  .legend { color: var(--ink3); font-size: 12px; margin: 26px 6px 0; line-height: 1.6; }
  @media (max-width: 420px) { h1 { font-size: 26px; } .hero .big { font-size: 23px; } .row { padding: 12px 14px; } .row.mini { padding: 8px 14px; }
    .story { padding: 11px 14px; } }

  .section a { color: var(--blue); text-transform: none; letter-spacing: 0; font-size: 14px; }
  .story .src { font-size: 12px; color: var(--ink3); margin-top: 3px; }

  /* Calendar: a strip of days, then the chosen day's agenda */
  .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: 14px -2px 0; position: relative; }
  .strip::-webkit-scrollbar { display: none; }
  .dbtn { all: unset; box-sizing: border-box; flex: 1 0 56px; text-align: center; padding: 8px 4px 8px; border-radius: 16px; cursor: pointer;
    background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .dbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .dbtn .wd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink3); }
  .dbtn .dn { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .dbtn.today .dn { color: var(--blue); }
  .dbtn .dots { display: flex; justify-content: center; gap: 3px; height: 5px; margin-top: 4px; }
  .dbtn .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink3); }
  .dbtn .dots i.g { background: var(--gold); } .dbtn .dots i.b { background: var(--blue); }
  .dbtn[aria-pressed="true"] { background: var(--blue); border-color: transparent; }
  .dbtn[aria-pressed="true"] .wd, .dbtn[aria-pressed="true"] .dn { color: #fff; }
  .dbtn[aria-pressed="true"] .dots i { background: rgba(255, 255, 255, 0.85); }

  @media (max-width: 700px) {
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-radius: 0; justify-content: space-around; gap: 0;
      padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      background: var(--bar); border-top: 1px solid var(--hair); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
    .tabs a { flex: 1; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; padding: 3px 4px; color: var(--ink3); }
    .tabs a[aria-current="page"] { background: transparent; box-shadow: none; color: var(--blue); }
    .tabs svg { width: 25px; height: 25px; }
    main { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<main>
  <header>
    <div><div class="date" id="date"></div><h1 id="ptitle">Today</h1></div>
    <div class="hdr-right">
      <nav class="tabs" aria-label="Pages">
        <a href="#today" data-page="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Today</a>
        <a href="#calendar" data-page="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</a>
        <a href="#stories" data-page="stories"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg>Storylines</a>
      </nav>
      <span class="stamp" id="stamp"></span>
    </div>
  </header>
  <div id="app"><div class="glass empty">Loading…</div></div>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tf = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const df = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
const sdf = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const wdf = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
const etDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
const dayKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const EMOJI = { soccer: '⚽️', football: '🏈', cricket: '🏏', rugby: '🏉', darts: '🎯', basketball: '🏀', hockey: '🏒', baseball: '⚾️', curling: '🥌', tennis: '🎾', golf: '⛳️', f1: '🏎️', boxing: '🥊', cycling: '🚴',
  snooker: '🎱', pool: '🎱', bowling: '🎳', running: '🏃', athletics: '🏃', marathon: '🏃', skating: '⛸️', 'figure skating': '⛸️',
  skiing: '⛷️', snowboarding: '🏂', motorsport: '🏁', nascar: '🏁', indycar: '🏁', motogp: '🏍️', sumo: '🤼', wrestling: '🤼',
  mma: '🥋', ufc: '🥋', swimming: '🏊', rowing: '🚣', sailing: '⛵️', horse: '🏇', racing: '🏇', 'horse racing': '🏇',
  volleyball: '🏐', handball: '🤾', badminton: '🏸', 'table tennis': '🏓', chess: '♟️', esports: '🎮', lacrosse: '🥍', triathlon: '🏊' };
const icon = (sport) => EMOJI[String(sport || '').toLowerCase()] || '🏟️';
// Rough "probably still on" lengths in hours, used when the hourly data has not caught up with a live game.
const LEN = { cricket: 8, football: 3.5, baseball: 3.5, darts: 9, soccer: 2, rugby: 2, basketball: 2.5, hockey: 2.5 };
const SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/';
const revealed = new Set();
let filter = 'all';
try { filter = localStorage.getItem('sb-filter') || 'all'; } catch {}
const PAGES = { today: 'Today', calendar: 'Calendar', stories: 'Storylines' };
const pageOf = () => { const h = location.hash.slice(1); return PAGES[h] ? h : 'today'; };
let calDay = null; // chosen calendar day; starts on today each visit
let data = null;
const liveData = new Map();   // event id -> fresher state/status/score from the browser's own polling
const feedFails = new Map();  // feed -> consecutive failures; a feed that keeps failing is left to the hourly data
let lastPoll = 0;

const isLive = (e, now) => { const d = new Date(e.start); return e.state === 'in' || (e.state === 'pre' && !e.timeTbc && d <= now && now - d < (LEN[e.sport] || 2.5) * 36e5); };
const isMine = (e) => e.tier === 1 || e.tier === 2;
const isPick = (e) => e.tier === 1 || e.pick || e.tier === 'marquee' || e.tier === 'wildcard';
const rank = (e) => e.tier === 1 ? 0 : (e.pick || e.tier === 'marquee' || e.tier === 'wildcard') ? 1 : 2;
const isMini = (e) => rank(e) === 2;
const linkOf = (e) => (e.watch?.options || []).find(o => o.owned !== false);
const hidden = (e) => e.hideScore && !revealed.has(e.id);
const hasScore = (e) => e.score && (e.score.home != null || e.score.away != null);

function until(d, now) {
  const m = Math.round((d - now) / 6e4);
  if (m < 60) return `in ${Math.max(m, 1)} min`;
  if (m < 24 * 60) return `in ${Math.floor(m / 60)}h ${m % 60}m`;
  return df.format(d);
}
function chips(w) {
  if (!w.options.length) return '<span class="chip no">Where to watch unknown</span>';
  return w.options.map(o => {
    const cls = o.owned === true ? 'own' : o.owned === null ? 'maybe' : 'no';
    const label = o.owned === true ? o.name + (o.free ? ' · free' : '') : o.owned === null ? o.name + '?' : 'Not on your services · ' + o.name;
    return `<span class="chip ${cls}">${esc(label)}</span>`;
  }).join('') + (w.note ? `<span class="note">${esc(w.note)}</span>` : '');
}
const star = (e) => e.tier === 1 ? '<span class="star">★</span>' : e.tier === 2 ? '<span class="star two">☆</span>' : '';
const revealBtn = (id, label = 'Score hidden · show') => `<button class="reveal" data-id="${esc(id)}">${esc(label)}</button>`;
const fullScore = (e) => `${esc(e.home)} ${esc(e.score.home)} · ${esc(e.away)} ${esc(e.score.away)}`;
const shortScore = (e) => e.awayAbbr && e.homeAbbr ? `${esc(e.awayAbbr)} ${esc(e.score.away)}–${esc(e.score.home)} ${esc(e.homeAbbr)}` : `${esc(e.score.away)}–${esc(e.score.home)}`;
function highlightsUrl(e) {
  if (e.links?.highlights) return e.links.highlights;
  const d = new Date(e.start).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${e.home || ''} vs ${e.away || ''} highlights ${d}`.trim());
}

function hero(e, now) {
  const live = isLive(e, now), d = new Date(e.start), link = linkOf(e);
  const kicker = live ? '<span class="pulse"></span>On now' : `Next up · ${until(d, now)}`;
  const st = statusOf(e), status = live && st && !hidden(e) ? `<div class="status">${esc(st)}</div>` : '';
  const score = live && hasScore(e) ? (hidden(e) ? revealBtn(e.id) : `<div class="score">${fullScore(e)}</div>${status}`) : '';
  const btn = link ? `<span class="btn">▶ Watch on ${esc(link.name)}${link.owned === null ? '?' : ''}</span>`
    : `<span class="btn off">${e.watch.options.length ? 'Not on your services · ' + esc(e.watch.options[0].name) : 'Where to watch unknown'}</span>`;
  const inner = `<span class="emoji">${icon(e.sport)}</span>
    <div class="kicker">${kicker}</div>
    <div class="big">${star(e)}${esc(e.title)}</div>
    <div class="sub">${esc([e.detail, e.league, live ? null : tf.format(d)].filter(Boolean).join(' · '))}</div>
    ${e.why ? `<div class="why">${esc(e.why)}</div>` : ''}${score}
    <div class="foot">${btn}${e.watch.note ? `<span class="note">${esc(e.watch.note)}</span>` : ''}</div>`;
  const cls = `glass hero${live ? ' live' : ''}`;
  return link ? `<a class="${cls}" href="${esc(link.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="${cls}">${inner}</div>`;
}

function miniRow(e, now) {
  const d = new Date(e.start), live = isLive(e, now), link = linkOf(e);
  let when;
  if (hasScore(e) && (e.state === 'post' || live)) when = hidden(e) ? revealBtn(e.id, 'Show') : shortScore(e);
  else when = e.state === 'post' ? 'Final' : live ? 'Live' : e.timeTbc ? 'TBC' : tf.format(d);
  const bits = [e.league, e.state === 'pre' && link ? link.name + (link.owned === null ? '?' : '') : null].filter(Boolean).join(' · ');
  const body = `<div class="ic">${icon(e.sport)}</div>
    <div class="line">${star(e)}<b>${esc(e.title)}</b>${bits ? ' · ' + esc(bits) : ''}</div>
    <div class="when${live ? ' live' : ''}">${when}</div>`;
  return link && e.state !== 'post' ? `<a class="row mini" href="${esc(link.url)}" target="_blank" rel="noopener">${body}</a>` : `<div class="row mini">${body}</div>`;
}

function row(e, now) {
  if (isMini(e)) return miniRow(e, now);
  const d = new Date(e.start), live = isLive(e, now), post = e.state === 'post', link = post ? null : linkOf(e);
  const when = post ? `Final<small>${sdf.format(d)}</small>` : live ? `Live<small>${tf.format(d)}</small>` : e.timeTbc ? `TBC` : tf.format(d);
  const score = hasScore(e) ? (hidden(e) ? revealBtn(e.id, post ? 'Result hidden · show' : 'Score hidden · show') : `<div class="rowscore">${fullScore(e)}</div>`) : '';
  const st = statusOf(e), status = st && e.state !== 'pre' && !hidden(e) && !/^(FT|Final)$/i.test(st) ? ' · ' + esc(st) : '';
  // Finished games: final score plus a highlights link (both behind the reveal for hidden teams).
  const tail = post ? (hidden(e) ? '' : `<div class="chips"><a class="chip link" href="${esc(highlightsUrl(e))}" target="_blank" rel="noopener">▶ Highlights</a></div>`)
    : `<div class="chips">${chips(e.watch)}</div>`;
  const body = `<div class="ic">${icon(e.sport)}</div>
    <div><div class="title">${star(e)}${esc(e.title)}</div>
      <div class="meta">${esc([e.detail, e.league].filter(Boolean).join(' · '))}${status}</div>
      ${e.why && !post ? `<div class="why">${esc(e.why)}</div>` : ''}${score}${tail}</div>
    <div class="when${live ? ' live' : ''}">${when}</div>`;
  const cls = `row${e.tier === 1 ? ' t1' : ''}`;
  return link ? `<a class="${cls}" href="${esc(link.url)}" target="_blank" rel="noopener">${body}</a>` : `<div class="${cls}">${body}</div>`;
}
const list = (items, now) => `<div class="glass list">${items.map(e => row(e, now)).join('')}</div>`;

// Takes [story, index] pairs; the index keys the reveal state, so it must be the story's position in data.stories.
function storylines(pairs, { sources = false } = {}) {
  return pairs.map(([s, i]) => {
    const tag = s.sport ? `<span class="tag${s.kind === 'event' ? ' event' : ''}">${esc(s.sport)}</span>` : '';
    if (s.spoiler && !revealed.has('story' + i)) return `<div class="story"><div class="txt">${tag}${revealBtn('story' + i, 'Result hidden · show')}</div></div>`;
    const src = sources && s.source ? `<div class="src">${esc(s.source)}</div>` : '';
    const inner = `<div><div class="txt">${tag}${esc(s.text)}</div>${src}</div>${s.url ? '<span class="go">›</span>' : ''}`;
    return s.url ? `<a class="story" href="${esc(s.url)}" target="_blank" rel="noopener"${s.source ? ` title="${esc(s.source)}"` : ''}>${inner}</a>` : `<div class="story">${inner}</div>`;
  }).join('');
}
const section = (left, right = '') => `<div class="section"><span>${left}</span>${right ? `<span>${right}</span>` : ''}</div>`;
const keep = (e) => filter === 'mine' ? isMine(e) : filter === 'picks' ? isPick(e) : true;

function buckets(now) {
  const evs = data.events;
  const live = evs.filter(e => isLive(e, now)).sort((a, b) => rank(a) - rank(b));
  const upcoming = evs.filter(e => !isLive(e, now) && e.state !== 'post' && (new Date(e.start) > now || e.timeTbc));
  const done = evs.filter(e => e.state === 'post').sort((a, b) => b.start.localeCompare(a.start));
  const next = upcoming.filter(e => !e.timeTbc && rank(e) < 2)[0] || upcoming.filter(e => !e.timeTbc)[0];
  return { live, upcoming, done, top: live.find(e => rank(e) < 2) || next || live[0] };
}

// Home: only what you want at your fingertips.
function pageToday(now) {
  const { live, upcoming, done, top } = buckets(now);
  const today = dayKey(now);
  let html = '';
  html += top ? hero(top, now) : '<div class="glass empty">Nothing on the schedule right now.</div>';

  const todays = [...live.filter(e => e !== top), ...upcoming.filter(e => e !== top && dayKey(new Date(e.start)) === today)]
    .sort((a, b) => a.start.localeCompare(b.start));
  html += section('On today', `<a href="#calendar">Calendar ›</a>`)
    + (todays.length ? list(todays, now) : `<div class="glass empty small">Nothing else today.</div>`);

  // Relevant results: your teams and the editor's picks from roughly the last day and a half.
  const recent = done.filter(e => rank(e) < 2 && now - new Date(e.start) < 36 * 36e5);
  if (recent.length) html += section('Latest results') + list(recent, now);

  if (data.stories?.length) html += section('Top storylines', `<a href="#stories">See all ›</a>`) + `<div class="glass list">${storylines(data.stories.slice(0, 3).map((s, i) => [s, i]))}</div>`;

  return html;
}

// Calendar: a strip of days (results behind, fixtures ahead), then the chosen day in full.
function pageCalendar(now) {
  const evs = data.events.filter(keep);
  const today = dayKey(now);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const times = data.events.map(e => new Date(e.start).getTime());
  let d = startOfDay(new Date(Math.min(now.getTime(), ...times)));
  const last = startOfDay(new Date(Math.max(now.getTime(), ...times)));
  const days = [];
  for (; d <= last; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) days.push(d);
  const byDay = new Map(days.map(x => [dayKey(x), []]));
  for (const e of evs) byDay.get(dayKey(new Date(e.start)))?.push(e);
  if (!calDay || !byDay.has(calDay)) calDay = today;

  let html = `<div class="seg" role="group" aria-label="Filter" style="margin-top:0">${[['all', 'Everything'], ['mine', 'My teams'], ['picks', 'Top picks']]
    .map(([k, l]) => `<button data-filter="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div>`;
  html += `<div class="strip" role="group" aria-label="Days">${days.map(x => {
    const k = dayKey(x), items = byDay.get(k);
    const dots = [items.some(e => e.tier === 1) && 'g', items.some(e => rank(e) === 1) && 'b', items.some(e => rank(e) === 2) && ''].filter(v => v !== false);
    return `<button class="dbtn${k === today ? ' today' : ''}" data-day="${k}" aria-pressed="${k === calDay}" aria-label="${esc(df.format(x))}, ${items.length} events">
      <div class="wd">${esc(k === today ? 'Today' : wdf.format(x))}</div><div class="dn">${x.getDate()}</div>
      <div class="dots">${dots.map(c => `<i class="${c}"></i>`).join('')}</div></button>`;
  }).join('')}</div>`;

  const sel = days.find(x => dayKey(x) === calDay);
  const items = [...byDay.get(calDay)].sort((a, b) => a.start.localeCompare(b.start));
  const past = sel < startOfDay(now);
  html += section(esc(df.format(sel)), calDay === today ? 'Today' : past ? 'Results' : '')
    + (items.length ? list(items, now) : `<div class="glass empty small">Nothing${filter === 'all' ? '' : ' in this filter'} on this day.</div>`);
  html += `<p class="legend">Full cards: ★ your teams and the day's top picks · One-line rows: ☆ secondary teams<br>Chips show where to watch. Green: on a service you have · Amber: unconfirmed · Grey: not on your services</p>`;
  return html;
}

function pageStories() {
  const st = data.stories || [];
  if (!st.length) return '<div class="glass empty">No storylines today.</div>';
  const pairs = st.map((s, i) => [s, i]);
  const block = (rows) => `<div class="glass list">${storylines(rows, { sources: true })}</div>`;
  const events = pairs.filter(([s]) => s.kind === 'event'), stories = pairs.filter(([s]) => s.kind !== 'event');
  let html = '';
  if (stories.length) html += section('Stories') + block(stories);
  if (events.length) html += section('Worth knowing about') + block(events);
  return html;
}

function render() {
  if (!data) return;
  const now = new Date(), page = pageOf();
  document.getElementById('app').innerHTML = page === 'calendar' ? pageCalendar(now) : page === 'stories' ? pageStories(now) : pageToday(now);
  document.getElementById('date').textContent = df.format(now);
  document.getElementById('ptitle').textContent = PAGES[page];
  document.title = page === 'today' ? 'Sport Brain' : `${PAGES[page]} · Sport Brain`;
  for (const a of document.querySelectorAll('.tabs a')) if (a.dataset.page === page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  const polled = lastPoll && now - lastPoll < 90e3;
  document.getElementById('stamp').innerHTML = polled ? '<span class="dot"></span>Live scores' : 'Updated ' + esc(tf.format(new Date(data.generatedAt)));
  const strip = document.querySelector('.strip'), on = strip?.querySelector('[aria-pressed="true"]');
  if (strip && on) strip.scrollLeft = on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2;
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

document.addEventListener('click', (ev) => {
  const r = ev.target.closest('button.reveal');
  if (r) { ev.preventDefault(); revealed.add(r.dataset.id); render(); return; }
  const f = ev.target.closest('button[data-filter]');
  if (f) { filter = f.dataset.filter; try { localStorage.setItem('sb-filter', filter); } catch {} render(); return; }
  const dd = ev.target.closest('button.dbtn');
  if (dd) { calDay = dd.dataset.day; render(); }
});

// ---- Live scores: poll ESPN scoreboards straight from the browser while anything is on or about to start.
const espnId = (e) => e.id.slice(e.id.indexOf('-') + 1);
const scoreOf = (c) => c?.score == null ? null : (typeof c.score === 'object' ? c.score.displayValue : String(c.score));
function wantsPoll(e, now) {
  if (!e.feed || e.timeTbc || e.state === 'post' || (feedFails.get(e.feed) || 0) >= 3) return false;
  const d = new Date(e.start);
  return e.state === 'in' || (d - now <= 10 * 6e4 && now - d < (LEN[e.sport] || 2.5) * 36e5);
}
async function board(feed, q) {
  const r = await fetch(SCOREBOARD + feed + '/scoreboard' + q, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return new Map((j.events || []).map(ev => [String(ev.id), ev]));
}
// Rugby: ESPN's clock text sticks at "1'" all game, so it is never shown. The phase comes from the status name,
// and the minute is counted on from the last scoring/card/sub event (details[].clock.value, exact match seconds).
// The "~" is honest: stoppages make the count run fast until the next event snaps it back.
const rugby = new Map(); // event id -> { phase, max, anchorSecs, anchorWall }
const R1 = 'STATUS_FIRST_HALF', RHT = 'STATUS_HALFTIME', R2 = 'STATUS_SECOND_HALF';
function trackRugby(id, ev, now = Date.now()) {
  const comp = ev.competitions?.[0] || {};
  const phase = comp.status?.type?.name || ev.status?.type?.name || '';
  const max = Math.max(0, ...(comp.details || []).map(d => +d.clock?.value || 0));
  const r = rugby.get(id);
  if (!r) { rugby.set(id, { phase, max, anchorSecs: null, anchorWall: 0 }); return; } // first sight: no anchor, the last event may be old
  if (max > r.max) { r.anchorSecs = max + 30; r.anchorWall = now; }
  if (phase === R2 && r.phase && r.phase !== R2 && (r.anchorSecs == null || r.anchorSecs < 2400)) { r.anchorSecs = 2400; r.anchorWall = now; }
  r.max = Math.max(r.max, max); r.phase = phase;
}
function rugbyText(id, now = Date.now()) {
  const r = rugby.get(id);
  if (!r) return '';
  if (r.phase === RHT) return 'Half-time';
  const second = r.phase === R2;
  if (!second && r.phase !== R1) return '';
  const half = second ? '2nd half' : '1st half';
  if (r.anchorSecs == null || (second && r.anchorSecs < 2400)) return half;
  const m = Math.floor((r.anchorSecs + (now - r.anchorWall) / 1000) / 60), cap = second ? 80 : 40;
  return m > cap ? `~${cap}+'` : `~${m}'`;
}
const statusOf = e => e.sport === 'rugby' ? (e.state === 'in' ? rugbyText(e.id) : (e.state === 'post' ? e.statusText : '')) : e.statusText;

function fromBoard(ev) {
  const comp = ev.competitions?.[0];
  if (!comp) return null;
  const cs = comp.competitors || [];
  const home = cs.find(c => c.homeAway === 'home') || cs[0], away = cs.find(c => c.homeAway === 'away') || cs[1];
  const st = comp.status?.type || ev.status?.type || {};
  const state = st.state || 'pre';
  return { state, statusText: comp.status?.summary || st.shortDetail || st.detail || '', score: state === 'pre' ? null : { home: scoreOf(home), away: scoreOf(away) } };
}
const applyLive = () => { if (data) for (const e of data.events) if (liveData.has(e.id)) Object.assign(e, liveData.get(e.id)); };
async function poll() {
  if (!data || document.hidden) return;
  const now = new Date();
  const byFeed = new Map();
  for (const e of data.events) if (wantsPoll(e, now)) (byFeed.get(e.feed) || byFeed.set(e.feed, []).get(e.feed)).push(e);
  if (!byFeed.size) return;
  let got = false;
  await Promise.all([...byFeed].map(async ([feed, evs]) => {
    try {
      let found = await board(feed, '');
      // The default board is "today" in ESPN's eyes; ask for the game's own date if it is not there (e.g. overnight cricket).
      for (const day of new Set(evs.filter(e => !found.has(espnId(e))).map(e => etDate.format(new Date(e.start)).replace(/-/g, ''))))
        found = new Map([...found, ...await board(feed, '?dates=' + day)]);
      for (const e of evs) { const ev = found.get(espnId(e)); const u = ev && fromBoard(ev); if (u) { if (e.sport === 'rugby') trackRugby(e.id, ev); liveData.set(e.id, u); got = true; } }
      feedFails.delete(feed);
    } catch { feedFails.set(feed, (feedFails.get(feed) || 0) + 1); }
  }));
  if (got) { lastPoll = Date.now(); applyLive(); render(); }
}

async function load() {
  try { data = await (await fetch('data/today.json', { cache: 'no-store' })).json(); applyLive(); render(); }
  catch (e) { if (!data) document.getElementById('app').innerHTML = '<div class="glass empty">Could not load the schedule.</div>'; }
}
load().then(poll);
setInterval(load, 5 * 60000); setInterval(poll, 30000); setInterval(render, 30000);
// Keep a running rugby minute ticking between polls.
setInterval(() => { if (!document.hidden && data?.events.some(e => e.sport === 'rugby' && e.state === 'in' && rugby.get(e.id)?.anchorSecs != null)) render(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load().then(poll); });
</script>
</body>
</html>
